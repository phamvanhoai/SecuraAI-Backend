services:
  postgres:
    image: postgres:17-alpine
    container_name: securaai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: securaai
      POSTGRES_USER: securaai
      POSTGRES_PASSWORD: change_me
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securaai -d securaai"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
