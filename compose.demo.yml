name: securaai-demo
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: securaai_demo
      POSTGRES_PASSWORD: ${DEMO_DB_PASSWORD:?Set DEMO_DB_PASSWORD in .env.docker}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - demo_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d securaai_demo"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    image: securaai-backend:local
    build: .
    restart: unless-stopped
    env_file: .env.docker.runtime
    environment: &backend_environment
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:${DEMO_DB_PASSWORD}@postgres:5432/securaai_demo?schema=public
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      DETECTION_PIPELINE_ENABLED: "true"
      CORS_ORIGINS: http://localhost:3001
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
  worker:
    image: securaai-backend:local
    restart: unless-stopped
    env_file: .env.docker.runtime
    environment: *backend_environment
    command: ["node", "dist/worker.js"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      backend:
        condition: service_healthy
  frontend:
    image: securaai-frontend:local
    build:
      context: ../SecuraAI-Frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:3000/api/v1
    restart: unless-stopped
    environment:
      BACKEND_API_BASE_URL: http://backend:3000/api/v1
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  demo_database:
    external: true
    name: securaai-postgres-demo-data
